const up=L.score>=4&&L.lv<5;h='<div class="big">'+(L.score>=4?'🌟':'💫')+'</div><h2 style="text-align:center">'+L.score+' out of 5!</h2><p style="text-align:center">'+(up?'Level up! You are now Level '+(L.lv+1)+'.':L.score>=4?'You finished the top level. Keep practicing!':'Nice try. Let’s practice this level again.')+'</p><div style="text-align:center"><button class="btn" data-act="start" data-a="'+L.a+'">Another mission</button><button class="btn alt" data-act="home">Planets</button></div>'}
else if(screen==='gu'){
h='<h2>Grown-up</h2><div class="card"><h3>Check what he knows</h3><p class="mute">Two short checks, 15 questions each. Sit beside him, read nothing for him, and let him tap. It is okay for him to say “I’m not sure.” Math missions then start where he is ready.</p><button class="btn" data-act="asm" data-s="math">Math check</button><button class="btn" data-act="asm" data-s="read">Reading check</button></div>';
for(const s of ['math','read']){const r=M.asm[s];if(r)h+='<div class="card"><h3>'+(s==='math'?'Math':'Reading')+' results · '+esc(r.d)+'</h3>'+report(s,r.best).map(x=>'<div class="res"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>').join('')+'</div>'}
h+='<div class="card"><h3>Note for your Learning Log</h3><textarea id="gt" readonly>'+esc(note())+'</textarea><button class="btn" data-act="copy">Copy</button></div>'}
else if(screen==='asmintro'){
h='<h2>'+(AS.sub==='math'?'Math':'Reading')+' check</h2><p>15 questions. There is no feedback while he answers, so it stays low pressure. Let him try on his own, and tap “Not sure” if he does not know.</p>'+(AS.sub==='read'?'<p class="mute">Some questions have him read a word or sentence himself. Sound should be on.</p>':'')+'<button class="btn" data-act="begin">Start</button>'}
else if(screen==='asmq'){
it=AS.item;h='<div class="prog" role="img" aria-label="Question '+(AS.qn+1)+' of 15">'+Array.from({length:15},(_,i)=>'<i class="'+(i<=AS.qn?'on':'')+'"></i>').join('')+'</div><p class="mute">Question '+(AS.qn+1)+' of 15</p>'+qView(it,'aa',false)+'<button class="btn alt" data-act="aa" data-i="-1">Not sure</button>'}
else if(screen==='asmdone'){
h='<div class="big">🌟</div><h2 style="text-align:center">All done!</h2><p style="text-align:center">Great work. Grown-up, see the results below.</p>'+'<div class="card">'+report(AS.sub,AS.best).map(x=>'<div class="res"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>').join('')+'</div>'+(AS.sub==='math'?'<p class="mute">Math missions will now start at the right level for each planet.</p>':'<p class="mute">Saved. Reading lessons will use this when we build them.</p>')+'<button class="btn" data-act="gu">Back to grown-up</button>'}
$('#v').innerHTML=(BACK[screen]?'<button class="btn alt back" data-act="back">← Back</button>':'')+h;
if(screen==='lesson'&&L.ans==null)speakItem(L.item);if(screen==='asmq')speakItem(AS.item);window.scrollTo(0,0)}

function report(s,best){return Object.keys(AR[s]).map(a=>[AR[s][a][1],best[a]?'Level '+best[a]+' of 4: '+DESC[a][best[a]-1]:'Starting at the beginning'])}
function note(){let t='';for(const s of ['math','read']){const r=M.asm[s];if(r)t+=(s==='math'?'Math':'Reading')+' check ('+r.d+'): '+report(s,r.best).map(x=>x[0]+' – '+x[1]).join('; ')+'.\n\n'}
const l=M.log.slice(-5).reverse();if(l.length)t+='Recent math missions: '+l.map(x=>AR.math[x.a][1]+' level '+x.lv+', '+x.sc+'/5').join('; ')+'.';return t||'No results yet.'}

ROOT.addEventListener('click',e=>{
const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,i=+t.dataset.i;
if(a==='snd'){sound=!sound;t.textContent=sound?'🔊':'🔇';if(!sound&&window.speechSynthesis)speechSynthesis.cancel();return}
if(a==='back')return go(BACK[screen]);
if(a==='home')return go('home');
if(a==='gu')return go('gu');
if(a==='hear'){const x=screen==='lesson'?L.item:AS.item;return speakItem(x)}
if(a==='start'){const k=t.dataset.a;L={a:k,lv:M.lv[k],n:0,score:0,ans:null,item:nextItem('math',k,M.lv[k])};return go('lesson')}
if(a==='ans'){if(L.ans!=null)return;L.ans=i;if(L.item.opts[i]===L.item.o[0])L.score++;return render()}
if(a==='nxt'){if(L.n==4){M.log.push({id:Date.now(),d:window.LD(),a:L.a,lv:L.lv,sc:L.score});if(L.score>=4&&L.lv<5)M.lv[L.a]=L.lv+1;save();return go('lres')}L.n++;L.ans=null;L.item=nextItem('math',L.a,L.lv);return render()}
if(a==='asm'){const s=t.dataset.s,ks=Object.keys(AR[s]);AS={sub:s,ks,qn:0,lvl:{},best:{}};ks.forEach(k=>{AS.lvl[k]=2;AS.best[k]=0});return go('asmintro')}
if(a==='begin'){AS.qn=0;AS.cur=AS.ks[0];AS.item=nextItem(AS.sub,AS.cur,AS.lvl[AS.cur]);return go('asmq')}
if(a==='aa'){const k=AS.cur,lv=AS.lvl[k],ok=i>=0&&AS.item.opts[i]===AS.item.o[0];if(ok){AS.best[k]=Math.max(AS.best[k],lv);AS.lvl[k]=Math.min(4,lv+1)}else AS.lvl[k]=Math.max(1,lv-1);
AS.qn++;if(AS.qn>=15){M.asm[AS.sub]={d:today(),best:AS.best};if(AS.sub==='math')for(const q in AS.best)M.lv[q]=Math.max(M.lv[q],Math.min(5,AS.best[q]+1));save();return go('asmdone')}
AS.cur=AS.ks[AS.qn%5];AS.item=nextItem(AS.sub,AS.cur,AS.lvl[AS.cur]);return render()}
if(a==='copy'){const ta=$('#gt');ta.select();try{navigator.clipboard.writeText(ta.value)}catch(x){try{document.execCommand('copy')}catch(y){}}t.textContent='Copied!'}
});
render();

window.SMAPI={gu:()=>go("gu"),home:()=>go("home")};

})(document.getElementById("h-math").shadowRoot);</script>
<script>(function(ROOT){

const SUBJ={math:{n:'Math',c:'var(--c1)'},ela:{n:'Language arts',c:'var(--c2)'},spell:{n:'Spelling',c:'var(--c3)'},sci:{n:'Science',c:'var(--c4)'},geo:{n:'Geography',c:'var(--c5)'}};
const SEED={
math:['Counts to 100 by 1s','Counts by 10s, 5s and 2s','Recognizes numbers 1–100','Adds within 10','Subtracts within 10','Names shapes and their sides','Tells time to the hour','Knows coin names and values'],
ela:['Knows letter names and sounds','Blends and reads CVC words','Reads 50 common sight words','Retells a story aloud','Answers questions about a read-aloud','Writes his first name','Dictates a sentence'],
spell:['Short a words (cat, map)','Short e words (bed, pen)','Short i words (sit, pig)','Short o words (hop, dog)','Short u words (bug, cup)','Beginning blends (st, bl, tr)','Digraphs (sh, ch, th)','Sight words (the, was, said)'],
sci:['Names the 5 senses','Sorts living and non-living things','Describes weather and seasons','Names parts of a plant','Sorts animal groups','Predicts, tests, and explains'],
geo:['Finds our state and country on a map','Names the 7 continents','Tells land from water on a map','Uses north, south, east and west','Knows his home address','Describes habitats']};
const RES={solo:'On his own',help:'With help',intro:'Just exploring'};
const KEY='learninglog.v1';
let S=load();S.imp=S.imp||[];let tab='log',openSubj='math',delId=null,DL=null,filt='all',lastSubj='math';
function seed(){const k=[];for(const s in SEED)SEED[s].forEach((n,i)=>k.push({id:s+i,s,n}));return{skills:k,logs:[],goal:30}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.skills&&v.logs)return v}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device. Use Back up on the Portfolio tab.')}}
const $=s=>ROOT.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function mkey(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;ROOT.appendChild(e);setTimeout(()=>e.remove(),2200)}
function wins(k){return new Set(S.logs.filter(r=>r.k===k&&r.r==='solo').map(r=>r.d)).size}
function status(k){const n=wins(k);if(n>=3)return['mast','Mastered'];if(n>=1)return['prac','Practicing'];if(S.logs.some(r=>r.k===k))return['intro','Introduced'];return['','Not started']}
function skillName(k){const s=S.skills.find(x=>x.id===k);return s?s.n:'General activity'}
const hrs=m=>(m/60).toFixed(1).replace(/\.0$/,'');
function mins(f){return S.logs.filter(f).reduce((a,r)=>a+(+r.m||0),0)}
function skillOpts(s){return S.skills.filter(x=>x.s===s).map(x=>'<option value="'+x.id+'">'+esc(x.n)+'</option>').join('')+'<option value="">General activity</option>'}

function render(){
const T=[['log','Log'],['skills','Skills'],['hours','Hours'],['port','Portfolio']];
$('#tabs').innerHTML=T.map(t=>'<button data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="true"':'')+'>'+t[1]+'</button>').join('');
$('#view').innerHTML=({log:vLog,skills:vSkills,hours:vHours,port:vPort})[tab]();
}


const MN={count:'Counting',add:'Adding',sub:'Subtracting',shapes:'Shapes',tm:'Time and money'};
function rdk(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}}
function pend(){const im=S.imp||(S.imp=[]);return{q:(rdk('sq.v1').log||[]).filter(l=>!im.includes('q'+l.id)),m:(rdk('sm.v1').log||[]).filter(l=>l.id&&!im.includes('m'+l.id))}}
function importCard(){const p=pend(),n=p.q.length+p.m.length;return '<div class="card"><h2>From his games</h2><p class="meta">'+(n?n+' new '+(n==1?'activity':'activities')+' from Space Quest and Space Math. Minutes are estimated (10 per Question Quest, 5 per math mission).':'Nothing new from Space Quest or Space Math yet.')+'</p>'+(n?'<button class="btn" data-act="imp">Add to my log</button>':'')+'</div>'}
function importAct(){const p=pend();let c=0;const add=(id,d,s,m,r,t)=>{S.logs.push({id,d:d||today(),s,k:'',m,r,t});c++};
p.q.forEach(l=>{S.imp.push('q'+l.id);add('iq'+l.id,l.d,'sci',10,'help','Space Quest: “'+l.q+'” '+(l.right?'Guess was right. ':'Learned something new. ')+'Found out by: '+l.m+'.'+(l.art?' Drew a picture.':'')+' (auto-added, minutes estimated)');if(l.w)add('is'+l.id,l.d,'spell',5,l.sp==='first'?'solo':'help','Space Quest spelling: “'+l.w+'” '+(l.sp==='first'?'on the first try':'with a few tries')+'. (auto-added)')});
p.m.forEach(l=>{S.imp.push('m'+l.id);add('im'+l.id,l.d,'math',5,l.sc>=4?'solo':'help','Space Math: '+MN[l.a]+' level '+l.lv+', '+l.sc+' of 5 right. (auto-added, minutes estimated)')});
save();render();toast(c+' entries added')}
function vLog(){
const recent=S.logs.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id)).slice(0,5);
return importCard()+'<div class="card"><h2>New entry</h2>'+
'<label for="f-d">Date</label><input type="date" id="f-d" value="'+today()+'">'+
'<div class="row"><div><label for="f-s">Subject</label><select id="f-s">'+Object.keys(SUBJ).map(s=>'<option value="'+s+'"'+(s===lastSubj?' selected':'')+'>'+SUBJ[s].n+'</option>').join('')+'</select></div>'+
'<div><label for="f-m">Minutes</label><input type="number" id="f-m" min="1" max="600" value="20" inputmode="numeric"></div></div>'+
'<label for="f-k">Skill practiced</label><select id="f-k">'+skillOpts(lastSubj)+'</select>'+
'<label for="f-r">How did it go?</label><select id="f-r"><option value="solo">On his own</option><option value="help">With help</option><option value="intro">Just exploring</option></select>'+
'<label for="f-t">What did you do? (photo saved? note the album or date)</label><textarea id="f-t" placeholder="Built words with letter tiles, spelled 5 of 6 out loud"></textarea>'+
'<button class="btn" data-act="addlog">Save entry</button></div>'+
'<div class="card"><h2>Recent entries</h2>'+(recent.length?recent.map(entry).join(''):'<p class="empty">Nothing logged yet. Your first entry will show up here.</p>')+'</div>'}

function entry(r){return '<div class="entry"><span class="tag" style="color:'+SUBJ[r.s].c+'">'+SUBJ[r.s].n+'</span> <span class="meta">'+fmt(r.d)+' · '+r.m+' min · '+RES[r.r]+'</span><div>'+esc(skillName(r.k))+'</div>'+(r.t?'<div class="meta">'+esc(r.t)+'</div>':'')+'</div>'}

function vSkills(){
return Object.keys(SUBJ).map(s=>{
const ks=S.skills.filter(x=>x.s===s),m=ks.filter(x=>wins(x.id)>=3).length,open=openSubj===s;
let h='<div class="card"><button class="btn alt small" data-act="toggle" data-s="'+s+'" style="width:100%;text-align:left;display:flex;justify-content:space-between;border-color:'+SUBJ[s].c+';color:var(--ink)" aria-expanded="'+open+'"><span>'+SUBJ[s].n+'</span><span>'+m+' of '+ks.length+' mastered</span></button>';
if(open){h+=ks.map(x=>{const st=status(x.id),w=Math.min(wins(x.id),3);return '<div class="skill"><div class="nm">'+esc(x.n)+'</div><span class="dots" title="'+w+' of 3 independent days">'+[0,1,2].map(i=>'<i class="'+(i<w?'on':'')+'"></i>').join('')+'</span><span class="chip '+st[0]+'">'+st[1]+'</span><button class="btn alt small" data-act="del" data-id="'+x.id+'" aria-label="Remove '+esc(x.n)+'">'+(delId===x.id?'Sure?':'×')+'</button></div>'}).join('')||'<p class="empty">No skills yet.</p>';
h+='<div class="row" style="margin-top:10px"><input id="ns-'+s+'" placeholder="Add your own skill" aria-label="New skill for '+SUBJ[s].n+'"><button class="btn small" style="flex:0 0 auto" data-act="addskill" data-s="'+s+'">Add</button></div>'}
return h+'</div>'}).join('')+'<p class="meta">A skill is Mastered after 3 successes “on his own” on 3 different days.</p>'}

function vHours(){
const now=new Date(),ym=today().slice(0,7),wk=new Date(now.getTime()-6*864e5),wkS=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
const mo=mins(r=>r.d.slice(0,7)===ym),w=mins(r=>r.d>=wkS),all=mins(()=>true),goal=+S.goal||0,pct=goal?Math.min(100,mo/60/goal*100):0,yr=Math.min(100,all/60/1116*100);
const per=Object.keys(SUBJ).map(s=>[s,mins(r=>r.s===s)]);const mx=Math.max(1,...per.map(p=>p[1]));
return '<div class="card"><div class="stat"><div><b>'+hrs(w)+'</b><span>hours, last 7 days</span></div><div><b>'+hrs(mo)+'</b><span>hours this month</span></div><div><b>'+hrs(all)+'</b><span>hours total</span></div></div></div>'+
'<div class="card"><h2>Monthly goal</h2><div class="bar" role="img" aria-label="'+Math.round(pct)+' percent of monthly goal"><i style="width:'+pct+'%"></i></div><p class="meta">'+hrs(mo)+' of '+goal+' hours this month</p><label for="g">Hours per month (raise it a little at a time)</label><input type="number" id="g" min="0" max="200" value="'+goal+'" inputmode="numeric"></div>'+
'<div class="card"><h2>By subject</h2>'+per.map(p=>'<div style="margin-bottom:8px"><div class="meta">'+SUBJ[p[0]].n+' · '+hrs(p[1])+' h</div><div class="bar"><i style="width:'+p[1]/mx*100+'%;background:'+SUBJ[p[0]].c+'"></i></div></div>').join('')+'</div>'+
'<div class="card"><h2>Kansas full-year benchmark</h2><div class="bar"><i style="width:'+yr+'%"></i></div><p class="meta">'+hrs(all)+' of 1,116 hours. Kansas expects this for grades 1–11 once he is 7. Confirm what counts with KSDE.</p></div>'}

function vPort(){
const L=S.logs.filter(r=>filt==='all'||r.s===filt).sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id));
const g={};L.forEach(r=>{(g[mkey(r.d)]=g[mkey(r.d)]||[]).push(r)});
return '<div class="card"><h2>Portfolio</h2><label for="pf">Show</label><select id="pf"><option value="all">All subjects</option>'+Object.keys(SUBJ).map(s=>'<option value="'+s+'"'+(filt===s?' selected':'')+'>'+SUBJ[s].n+'</option>').join('')+'</select>'+
'<button class="btn" data-act="dlport">Download portfolio</button> '+
'<button class="btn alt" data-act="backup">Back up data</button> <label class="btn alt" style="display:inline-block;width:auto;cursor:pointer;font-size:1rem">Restore backup<input type="file" id="rf" accept=".json" style="display:none"></label>'+
'<p class="meta">Data is saved in this browser on this device. Back up now and then.</p></div>'+
'<div class="card">'+(L.length?Object.keys(g).map(k=>'<h3>'+esc(k)+'</h3>'+g[k].map(entry).join('')).join(''):'<p class="empty">No entries yet.</p>')+'</div>'}

function portHtml(){
const done=S.skills.filter(x=>wins(x.id)>=3),L=S.logs.slice().sort((a,b)=>a.d.localeCompare(b.d));
return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Homeschool learning portfolio</title><style>body{font:16px/1.5 Georgia,serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}h1,h2{font-family:Arial,sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px;text-align:left;vertical-align:top;font-size:14px}</style></head><body><h1>Homeschool learning portfolio</h1><p>Generated '+esc(fmt(today()))+'. Total instruction time logged: '+hrs(mins(()=>true))+' hours.</p><h2>Skills mastered ('+done.length+')</h2><ul>'+(done.map(x=>'<li>'+esc(SUBJ[x.s].n)+': '+esc(x.n)+'</li>').join('')||'<li>None yet</li>')+'</ul><h2>Activity log</h2><table><tr><th>Date</th><th>Subject</th><th>Skill</th><th>Min</th><th>Result</th><th>Notes</th></tr>'+L.map(r=>'<tr><td>'+esc(fmt(r.d))+'</td><td>'+esc(SUBJ[r.s].n)+'</td><td>'+esc(skillName(r.k))+'</td><td>'+esc(r.m)+'</td><td>'+esc(RES[r.r])+'</td><td>'+esc(r.t||'')+'</td></tr>').join('')+'</table></body></html>'}

async function dl(name,data){if(DL){try{await DL.save({filename:name,data});toast('Saved')}catch(e){if(e&&e.code!=='declined')toast('Could not save that file.')}return}try{const type=/\.json$/.test(name)?'application/json':'text/html';const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Saved to your downloads')}catch(e){toast('Could not save that file.')}}

ROOT.addEventListener('click',e=>{
const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
if(t.dataset.tab){tab=t.dataset.tab;return render()}
const a=t.dataset.act;
if(a==='addlog'){const m=Math.max(1,Math.min(600,+$('#f-m').value||0));if(!m)return toast('Add the minutes spent.');lastSubj=$('#f-s').value;S.logs.push({id:'l'+Date.now(),d:$('#f-d').value||today(),s:lastSubj,k:$('#f-k').value,m,r:$('#f-r').value,t:$('#f-t').value.trim()});save();render();toast('Entry saved')}
if(a==='toggle'){openSubj=openSubj===t.dataset.s?'':t.dataset.s;render()}
if(a==='del'){if(delId===t.dataset.id){S.skills=S.skills.filter(x=>x.id!==delId);delId=null;save()}else delId=t.dataset.id;render()}
if(a==='addskill'){const s=t.dataset.s,i=$('#ns-'+s),n=i.value.trim();if(!n)return;S.skills.push({id:'c'+Date.now(),s,n});save();render()}
if(a==='imp')return importAct();
if(a==='dlport')dl('learning-portfolio.html',portHtml());
if(a==='backup')dl('learning-log-backup.json',JSON.stringify(S));
});
ROOT.addEventListener('change',e=>{
const i=e.target.id;
if(i==='f-s'){lastSubj=e.target.value;$('#f-k').innerHTML=skillOpts(lastSubj)}
if(i==='g'){S.goal=Math.max(0,+e.target.value||0);save();render()}
if(i==='pf'){filt=e.target.value;render()}
if(i==='rf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.skills)||!Array.isArray(v.logs))throw 0;S=v;save();render();toast('Backup restored')}catch(x){toast('That file is not a valid backup.')}};r.readAsText(f)}
});
render();
(async()=>{try{if(window.claude&&claude.use){DL=await claude.use('downloads');if(tab==='port')render()}}catch(e){}})();

window.SLAPI={refresh:()=>{S.imp=S.imp||[];render()}};

})(document.getElementById("h-log").shadowRoot);</script>
<script>
(function(){
const ids=['quest','math','log'];
function show(id,after){document.getElementById('home').hidden=!!id;document.getElementById('bar').hidden=!id;ids.forEach(function(i){document.getElementById('app-'+i).hidden=i!==id});
if(id==='log'&&window.SLAPI)window.SLAPI.refresh();if(after)after();window.scrollTo(0,0);if(window.speechSynthesis)speechSynthesis.cancel()}
document.addEventListener('click',function(e){const t=e.target.closest('[data-go]');if(!t)return;const g=t.dataset.go;
if(g==='home')return show('');if(g==='check')return show('math',function(){window.SMAPI&&window.SMAPI.gu()});show(g)});
})();
</script>
</body></html>
